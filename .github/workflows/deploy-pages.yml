# Pubblica le pagine pubbliche (docs/) su GitHub Pages.
#
# Perche' esiste: Pages era configurato come "deploy from a branch" sul branch
# `gestionale`, cartella /docs. Rinominato/eliminato quel branch, GitHub ha
# disattivato Pages e TUTTI i link inviati ai clienti
# (repair-status.html / approve-quote.html) hanno iniziato a dare 404.
# Con questo workflow il sito non dipende piu' dal nome del branch: si
# ripubblica da solo a ogni push su `main` che tocca docs/.
#
# SETUP UNA TANTUM (gia' fatto? allora non serve nulla): Settings > Pages >
# Source = "GitHub Actions". Il GITHUB_TOKEN di Actions NON puo' creare il
# sito Pages da solo (`configure-pages` con `enablement: true` risponde
# "Resource not accessible by integration"): la creazione del sito richiede
# i permessi di admin del repo, quindi va fatta una volta dall'interfaccia.
# Da li' in poi ogni push su main che tocca docs/ ripubblica da solo, e il
# deploy non dipende piu' dal nome del branch.
name: Deploy pagine pubbliche (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy alla volta; non annullare quelli gia' in corso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Job separato SENZA `environment:`: finche' Pages e' disattivato l'ambiente
  # `github-pages` non esiste e un job che lo dichiara fallisce prima ancora di
  # eseguire uno step. Tenendo il build separato, l'artifact viene comunque
  # prodotto e in caso di setup mancante fallisce solo il deploy, con un errore
  # leggibile.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configura Pages
        uses: actions/configure-pages@v5

      - name: Carica la cartella docs/
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
